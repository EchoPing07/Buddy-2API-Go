# Release（打 tag）自动发布流水线：
#   1. 交叉编译主流平台二进制：Linux / Windows / macOS × amd64 / arm64 / armv7 / riscv64
#   2. 压缩归档（windows=zip，其余=tar.gz），上传到 Release 附件，附 SHA256 校验和
#   3. 构建多架构 Docker 镜像（linux/amd64 + linux/arm64）并推送到 GHCR（ghcr.io/<owner>/<repo>）
#
# 用法：git tag v1.0.0 && git push origin v1.0.0，然后在 GitHub 上把这个 tag 发布成 Release。
name: Release

on:
  release:
    types: [published]
  # 手动触发（用于补跑；建议先推送 tag，例如 v1.0.0）
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 附件
  packages: write   # 推送 GHCR 镜像

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────── 1. 交叉编译二进制 ─────────────────────────
  build-binaries:
    name: 构建 ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            label: linux-amd64
          - os: linux
            arch: arm64
            label: linux-arm64
          - os: linux
            arch: arm
            goarm: "7"
            label: linux-armv7
          - os: linux
            arch: riscv64
            label: linux-riscv64
          - os: windows
            arch: amd64
            label: windows-amd64
          - os: windows
            arch: arm64
            label: windows-arm64
          - os: darwin
            arch: amd64
            label: darwin-amd64
          - os: darwin
            arch: arm64
            label: darwin-arm64
          # 需要 32 位 x86 时可取消注释：
          # - os: linux
          #   arch: "386"
          #   label: linux-386
          # - os: windows
          #   arch: "386"
          #   label: windows-386
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X buddy2api-go/internal/proxy.Version=${VERSION}" \
            -o "dist/buddy2api-${GOOS}-${GOARCH}${ext}" .

      - name: 压缩归档
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          if [ "$GOOS" = "windows" ]; then
            cd dist
            zip "buddy2api-${LABEL}.zip" "buddy2api-${GOOS}-${GOARCH}.exe"
            rm "buddy2api-${GOOS}-${GOARCH}.exe"
          else
            tar -czf "dist/buddy2api-${LABEL}.tar.gz" -C dist "buddy2api-${GOOS}-${GOARCH}"
            rm "dist/buddy2api-${GOOS}-${GOARCH}"
          fi

      - name: 上传 Release 附件
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: 上传工作流产物（供校验和任务汇总）
        uses: actions/upload-artifact@v4
        with:
          name: buddy2api-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ───────────────────────── 2. SHA256 校验和 ─────────────────────────
  checksums:
    name: 生成 SHA256 校验和
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部二进制产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: buddy2api-*
          merge-multiple: true

      - name: 生成校验和文件
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 上传校验和到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS

  # ───────────────────────── 3. Docker 镜像 ─────────────────────────
  docker:
    name: Docker 镜像（amd64 + arm64）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 QEMU（跨架构构建模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
