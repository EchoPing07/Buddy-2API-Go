      <section x-cloak class="space">
        <header class="page-head">
          <h1>账号</h1>
          <div class="page-actions">
            <button class="btn btn-secondary btn-sm" @click="openExport()" :disabled="loading"><span class="ic" x-html="ic('upload')"></span>导出凭证</button>
            <button class="btn btn-secondary btn-sm" @click="openImport()"><span class="ic" x-html="ic('download')"></span>导入凭证</button>
            <template x-if="account.logged_in">
              <button class="btn btn-secondary btn-sm" @click="refreshToken()" :disabled="loading"><span class="ic" x-html="ic('refresh')"></span>刷新 Token</button>
            </template>
            <template x-if="account.logged_in">
              <button class="btn btn-secondary btn-sm" @click="testAccount()" :disabled="loading"><span class="ic" x-html="ic('shield')"></span>测试连通</button>
            </template>
            <template x-if="account.logged_in">
              <button class="btn btn-danger btn-sm" @click="deleteAccount()" :disabled="loading"><span class="ic" x-html="ic('logout')"></span>退出登录</button>
            </template>
          </div>
        </header>

        <template x-if="account.logged_in">
          <div class="card">
            <div class="card-head">
              <h3>OAuth 凭证</h3>
              <span class="badge" :class="account.expired?'badge-err':'badge-ok'" x-text="account.expired?'已过期':'正常'"></span>
              <span class="badge" :class="account.region_match?'badge-muted':'badge-warn'" x-text="account.region_match?'与当前端点匹配':'凭证属于另一端点'"></span>
              <div class="spacer"></div>
              <span class="muted-xs" x-text="'uid '+(account.uid||'—')"></span>
            </div>
            <div class="kv-grid">
              <div class="kv"><span class="k">昵称</span><span class="v" x-text="account.nickname||'—'"></span></div>
              <div class="kv"><span class="k">enterprise_id</span><span class="v" x-text="account.enterprise_id||'（个人账号）'"></span></div>
              <div class="kv"><span class="k">domain</span><span class="v" x-text="account.domain||'—'"></span></div>
              <div class="kv"><span class="k">access_token</span><span class="v mono" x-text="account.access_token"></span></div>
              <div class="kv"><span class="k">refresh_token</span><span class="v" x-text="account.has_refresh?'已保存':'无'"></span></div>
              <div class="kv"><span class="k">过期时间</span><span class="v" x-text="account.expires_human+(account.expires_at?'（'+ts(account.expires_at)+'）':'')"></span></div>
            </div>
          </div>
        </template>

        <div class="card">
          <div class="card-head"><h3 x-text="account.logged_in?'重新登录':'登录'"></h3></div>
          <template x-if="!oauth.state">
            <div>
              <p class="oauth-desc">点击开始后，在打开的浏览器页面中完成授权登录。凭证仅保存在本地 data 目录。</p>
              <button class="btn" @click="oauthStart()" :disabled="loading"><span class="ic" x-html="ic('external')"></span>开始登录</button>
            </div>
          </template>
          <template x-if="oauth.state">
            <div class="oauth-box">
              <p>请在浏览器中打开以下链接完成授权：</p>
              <div class="oauth-url"><a :href="oauth.auth_url" target="_blank" rel="noreferrer" x-text="oauth.auth_url"></a></div>
              <div class="row-center">
                <a :href="oauth.auth_url" target="_blank" rel="noreferrer"><button class="btn btn-secondary btn-sm"><span class="ic" x-html="ic('external')"></span>打开授权页面</button></a>
                <button class="btn btn-ghost btn-sm" @click="copy(oauth.auth_url)"><span class="ic" x-html="ic('copy')"></span>复制链接</button>
                <span class="muted-xs" x-text="oauth.poll_msg"></span>
                <button class="btn btn-ghost btn-sm" @click="oauthCancel()">取消</button>
              </div>
            </div>
          </template>
        </div>

        <!-- 多账号档案：切换只改活动凭证（token.json），不轮询、不故障转移 -->
        <div class="card">
          <div class="card-head">
            <h3>账号切换</h3>
            <span class="muted-xs" x-show="accounts.loaded" x-text="accounts.items.length+' 个已存账号'"></span>
            <div class="spacer"></div>
            <span class="muted-xs">登录或导入凭证后自动存档</span>
          </div>
          <div class="empty" x-show="accounts.loaded && !accounts.items.length">
            <span class="ic ic-lg" x-html="ic('account')"></span>
            还没有其它账号
          </div>
          <div class="table-wrap" x-show="accounts.items.length">
            <table>
              <thead><tr><th>账号</th><th>uid</th><th>端点</th><th>有效期</th><th></th></tr></thead>
              <tbody>
                <template x-for="a in accounts.items" :key="a.uid">
                  <tr>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <span x-text="a.nickname||'未命名'"></span>
                        <span class="badge" :class="a.active?'badge-ok':(a.expired?'badge-err':'badge-muted')"
                              x-text="a.active?'当前':(a.expired?'已过期':'正常')"></span>
                        <span class="badge badge-warn" x-show="!a.region_match" title="凭证属于另一端点">端点不匹配</span>
                      </div>
                    </td>
                    <td class="mono" x-text="(a.uid||'').slice(-10)"></td>
                    <td x-text="a.domain||'—'"></td>
                    <td x-text="a.expires_at?ts(a.expires_at)+'（'+a.expires_human+'）':'—'"></td>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <button class="btn btn-secondary btn-sm" x-show="!a.active"
                                @click="switchAccount(a)" :disabled="loading">切换</button>
                        <button class="btn btn-ghost btn-sm" style="color:var(--destructive)" x-show="!a.active"
                                @click="removeAccount(a)" :disabled="loading">移除</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <!-- ═══ 号池状态（实验特性；仅开关开启时渲染） ═══
             数据来自 GET /admin/pool（内存快照）+ /admin/accounts（档案元信息）。
             与上面「账号切换」的区别：那一块是切换**当前活动账号**（后台任务跟着走），
             这一块只是分发策略，切换这里不会改当前账号。 -->
        <div class="card" x-show="labs.pool_enabled">
          <div class="card-head">
            <h3>号池状态</h3>
            <span class="muted-xs" x-show="pool"
                  x-text="(pool?pool.member_count:0)+' 个账号 · '+(pool?pool.available_now:0)+' 个可用 · '+(pool?pool.session_count:0)+' 个活跃会话'"></span>
            <div class="spacer"></div>
            <button class="btn btn-ghost btn-sm" @click="poolProbeAll()" :disabled="loading">全部探测</button>
            <button class="btn btn-ghost btn-sm" @click="poolResetSessions()" :disabled="loading">重置会话绑定</button>
          </div>
          <p class="field-hint">
            只有 <span class="mono">/v1/chat/completions</span> 走号池；签到 / 成长任务 / 余额面板仍走<b>当前活动账号</b>（即下方「账号切换」里标「当前」那个）。
          </p>
          <div class="empty" x-show="pool && !pool.accounts.length">
            <span class="ic ic-lg" x-html="ic('account')"></span>
            号池里还没有账号
          </div>
          <div class="table-wrap" x-show="pool && pool.accounts.length">
            <table>
              <thead><tr><th>账号</th><th>状态</th><th>额度</th><th>限额中的模型</th><th>会话</th><th>成功 / 失败</th><th>操作</th></tr></thead>
              <tbody>
                <template x-for="a in (pool?pool.accounts:[])" :key="a.uid">
                  <tr>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <span x-text="a.nickname||'未命名'"></span>
                        <span class="badge badge-ok" x-show="a.active" title="当前活动账号（后台任务与余额面板走它）">当前</span>
                        <span class="badge badge-warn" x-show="!a.region_match" title="凭证属于另一端点">端点不匹配</span>
                      </div>
                      <div class="muted-xs mono" x-text="(a.uid||'').slice(-10)"></div>
                    </td>
                    <td>
                      <span class="badge" :class="poolStateClass(a)" x-text="poolStateText(a)"></span>
                      <div class="muted-xs" x-show="a.auto_disabled_msg" :title="a.auto_disabled_msg"
                           x-text="a.auto_disabled_msg.slice(0,40)"></div>
                    </td>
                    <td>
                      <template x-if="a.credits>0"><span x-text="fmtDosage(a.credits)"></span></template>
                      <template x-if="!(a.credits>0)"><span class="muted-xs">—</span></template>
                    </td>
                    <td>
                      <template x-for="c in (a.model_cooldowns||[])" :key="c.model">
                        <div class="row" style="gap:6px;flex-wrap:nowrap">
                          <span class="mono" x-text="c.model"></span>
                          <span class="muted-xs" :title="'上游重置时间 '+ts(c.reset_at)+'；实际生效截止 '+ts(c.until)+(c.reset_at&&c.reset_at!==c.until?'（已被上限截断）':'')"
                                x-text="'剩 '+coolLeft(c.until)"></span>
                          <button class="btn btn-ghost btn-sm" @click="poolClearCool(a,c)"
                                  :disabled="loading" title="我知道它好了，让我试试">清除</button>
                        </div>
                      </template>
                      <span class="muted-xs" x-show="!(a.model_cooldowns||[]).length">—</span>
                    </td>
                    <td x-text="a.bound_sessions"></td>
                    <td>
                      <span class="mono" x-text="a.success_count+' / '+a.error_count"></span>
                      <div class="muted-xs" x-show="a.last_probe_at"
                           :title="a.last_probe_msg"
                           x-text="'探测 '+ts(a.last_probe_at)"></div>
                    </td>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <button class="btn btn-ghost btn-sm" x-show="!a.manual_disabled"
                                style="color:var(--destructive)" @click="poolDisable(a)" :disabled="loading">禁用</button>
                        <button class="btn btn-secondary btn-sm" x-show="a.manual_disabled"
                                @click="poolEnable(a)" :disabled="loading">启用</button>
                        <button class="btn btn-ghost btn-sm" @click="poolProbe(a)"
                                :disabled="loading||a.manual_disabled" title="调 billing 接口查凭证与额度">探测</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="field-hint code-hint" x-show="pool">
            <div>* 粘性命中率 <span class="mono" x-text="pool?pool.sticky_hit_total+' / '+(pool.sticky_hit_total+pool.sticky_miss_total):'—'"></span>
                 （低命中率说明会话键不稳定，去「实验」页看客户端接入示例）</div>
            <div>* 「限额中的模型」只影响该模型；整个账号被禁用看「状态」列</div>
          </div>
        </div>

      </section>

<!-- ═══ 导出凭证弹窗 ═══ -->
<template x-if="exportModal">
  <div class="overlay" @click.self="exportModal=false">
    <div class="modal" style="max-width:560px" role="dialog" aria-label="导出凭证">
      <div class="modal-title">导出凭证</div>
      <p class="modal-msg">导出为凭证包（JSON，内含 access_token，请妥善保管），可经「导入凭证 → 批量」还原到任意实例。</p>
      <div class="seg" role="tablist" aria-label="导出方式">
        <button type="button" class="seg-btn" role="tab" :class="{'is-active':exportForm.scope==='current'}"
                :disabled="!account.logged_in" @click="setExportScope('current')">单个导出</button>
        <button type="button" class="seg-btn" role="tab" :class="{'is-active':exportForm.scope==='selected'}"
                :disabled="!accounts.items.length" @click="setExportScope('selected')">
          批量导出<span x-show="accounts.items.length" x-text="'（'+accounts.items.length+'）'"></span>
        </button>
      </div>
      <div x-show="exportForm.scope==='current'" class="field-hint" style="margin-top:12px">
        <template x-if="account.logged_in">
          <span x-text="'将导出当前活动账号：'+(account.nickname||'未命名')+'（'+(account.uid||'—')+'）'"></span>
        </template>
        <template x-if="!account.logged_in"><span>当前没有活动账号，无可导出内容。</span></template>
      </div>
      <div x-show="exportForm.scope==='selected'">
        <div class="row" style="margin:12px 0 8px;gap:8px">
          <span class="label" style="margin:0">选择要导出的账号</span>
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost btn-sm" @click="exportSelectAll()"
                  x-text="exportAllSelected()?'取消全选':'全选'"></button>
        </div>
        <div class="pick-list">
          <template x-for="a in accounts.items" :key="a.uid">
            <label class="pick-row">
              <input type="checkbox" :checked="exportForm.uids.includes(a.uid)" @change="toggleExportUID(a.uid)">
              <span class="pick-name" x-text="a.nickname||'未命名'"></span>
              <span class="mono muted-xs" x-text="'…'+(a.uid||'').slice(-8)"></span>
              <span class="badge" :class="a.active?'badge-ok':'badge-muted'" x-show="a.active">当前</span>
              <span class="badge badge-err" x-show="a.expired&&!a.active">已过期</span>
              <span class="badge badge-warn" x-show="!a.region_match">端点不匹配</span>
            </label>
          </template>
        </div>
        <p class="field-hint" x-show="!exportForm.uids.length">尚未选择任何账号。</p>
        <p class="field-hint" x-show="exportAllSelected()" x-text="'已全选 '+accounts.items.length+' 个账号'"></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary btn-sm" @click="exportModal=false">取消</button>
        <button type="button" class="btn btn-sm" @click="exportAccounts()"
                :disabled="loading || exportCount()===0">
          <span class="spin" x-show="loading"></span>
          <span x-text="'导出 '+exportCount()+' 个账号'"></span>
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ═══ 导入凭证弹窗（单个 / 批量） ═══ -->
<template x-if="importModal">
  <div class="overlay" @click.self="importModal=false">
    <form class="modal" style="max-width:560px" @submit.prevent="importMode==='batch' ? importBatch() : importAccount(false)">
      <div class="modal-title">导入凭证</div>
      <div class="seg" role="tablist" aria-label="导入方式">
        <button type="button" class="seg-btn" role="tab" :class="{'is-active':importMode==='single'}"
                @click="setImportMode('single')">单个账号</button>
        <button type="button" class="seg-btn" role="tab" :class="{'is-active':importMode==='batch'}"
                @click="setImportMode('batch')">批量导入</button>
      </div>

      <!-- 单个账号：手动填写或选 token.json -->
      <div x-show="importMode==='single'">
        <p class="modal-msg" style="margin-top:12px">从 token.json 文件导入，或手动填写 access_token（合法 JWT，其余字段可留空，将从 JWT 自动解析）。<br>「仅导入」只存入账号列表，当前账号不变；「导入并启用」会立即切换为当前账号。</p>
        <div class="form-row">
          <label class="label">从文件导入</label>
          <div class="row">
            <input x-ref="importFileInput" type="file" accept=".json,application/json" style="display:none" @change="onImportFile($event)">
            <button type="button" class="btn btn-secondary btn-sm" @click="$refs.importFileInput.click()"><span class="ic" x-html="ic('download')"></span>选择文件</button>
          </div>
          <p class="field-hint" x-show="importForm.filename" x-text="'已选择：'+importForm.filename"></p>
        </div>
        <div class="form-row">
          <label class="label">access_token</label>
          <textarea class="input" rows="3" x-model="importForm.access_token" placeholder="eyJhbGciOi..." style="height:auto;resize:vertical;font-size:var(--fs-2xs)"></textarea>
        </div>
        <div class="form-grid c2">
          <div class="form-row"><label class="label">refresh_token（可选）</label><input class="input mono" x-model="importForm.refresh_token" style="font-size:var(--fs-2xs)"></div>
          <div class="form-row"><label class="label">domain（可选）</label><input class="input" x-model="importForm.domain" placeholder="留空按当前端点"></div>
        </div>
      </div>

      <!-- 批量导入：凭证包一次性入档，恒不切换当前账号 -->
      <div x-show="importMode==='batch'">
        <p class="modal-msg" style="margin-top:12px">选择由「导出凭证」生成的凭证包（.json），可一次导入多个账号。<br><strong>批量导入只会存入账号列表，不会切换当前账号</strong>；导入完成后到「账号切换」卡片点「切换」启用。</p>
        <div class="form-row">
          <label class="label">凭证包文件</label>
          <div class="row">
            <input x-ref="batchFileInput" type="file" accept=".json,application/json" style="display:none" @change="onBatchFile($event)">
            <button type="button" class="btn btn-secondary btn-sm" @click="$refs.batchFileInput.click()"><span class="ic" x-html="ic('download')"></span>选择凭证包</button>
            <span class="muted-xs" x-show="batchForm.filename" x-text="batchForm.filename"></span>
          </div>
          <p class="field-hint" x-show="batchForm.error" style="color:var(--err-fg)" x-text="batchForm.error"></p>
        </div>
        <div x-show="batchForm.items.length">
          <p class="field-hint" x-text="'已读取 '+batchForm.items.length+' 个账号，将全部仅导入到账号列表：'"></p>
          <div class="pick-list">
            <template x-for="(a,i) in batchForm.items" :key="i">
              <div class="pick-row">
                <span class="pick-name" x-text="a.nickname||'未命名'"></span>
                <span class="mono muted-xs" x-text="'…'+String(a.uid||'').slice(-8)"></span>
                <span class="muted-xs truncate" x-text="a.domain||''"></span>
              </div>
            </template>
          </div>
        </div>
        <div x-show="batchResult" class="result-box-wrap">
          <p class="field-hint"
             x-text="'导入完成：成功 '+batchResult.imported+' 个，失败 '+batchResult.failed+' 个'"></p>
          <div class="result-box">
            <template x-for="(r,i) in batchResult.items" :key="i">
              <div class="row result-row">
                <span class="badge" :class="r.ok?'badge-ok':'badge-err'" x-text="r.ok?'已导入':'失败'"></span>
                <span class="muted-xs" style="flex:1" x-text="r.error || (r.nickname||'未命名')+'（…'+String(r.uid||'').slice(-8)+'）'"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-secondary btn-sm" @click="importModal=false">取消</button>
        <template x-if="importMode==='batch'">
          <button type="submit" class="btn btn-sm" :disabled="loading || !batchForm.items.length">
            <span class="spin" x-show="loading"></span>
            <span x-text="batchForm.items.length ? '仅导入 '+batchForm.items.length+' 个账号' : '仅导入'"></span>
          </button>
        </template>
        <template x-if="importMode==='single'">
          <div class="row" style="gap:8px">
            <button type="button" class="btn btn-secondary btn-sm" @click="importAccount(false)" :disabled="loading">
              <span class="spin" x-show="loading && !importActivate"></span>
              <span x-show="!loading || importActivate">仅导入</span>
            </button>
            <button type="button" class="btn btn-sm" @click="importAccount(true)" :disabled="loading">
              <span class="spin" x-show="loading && importActivate"></span>
              <span x-show="!loading || !importActivate">导入并启用</span>
            </button>
          </div>
        </template>
      </div>
    </form>
  </div>
</template>
