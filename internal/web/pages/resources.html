      <section x-cloak class="space">
        <header class="page-head">
          <h1>余额</h1>
          <div class="page-actions">
            <select class="select select-sm" style="width:auto;min-width:140px"
                    x-model="resourceUID" @change="selectResourceUID($event.target.value)" aria-label="选择查看账号">
              <option value="all">全部账号</option>
              <template x-for="a in resourceAccountOptions" :key="accountUID(a)">
                <option :value="accountUID(a)" :selected="resourceUID===accountUID(a)" x-text="accountLabel(a)+(a.active?'（主账号）':'')"></option>
              </template>
            </select>
            <span class="muted-xs" x-show="resources.updated_at" x-text="'更新于 '+ts(resources.updated_at)"></span>
            <button type="button" class="btn btn-secondary btn-sm" :class="{'is-active':hideDepleted}"
                    :aria-pressed="hideDepleted?'true':'false'"
                    :title="(hideDepleted?'已开启：隐藏剩余额度为 0 或已过期的额度包':'隐藏剩余额度为 0 或已过期的额度包')"
                    @click="toggleHideDepleted()">
              <span class="ic" x-html="ic(hideDepleted?'eyeOff':'eye')"></span>
              <span x-text="hideDepleted?'已隐藏用完':'隐藏已用完'"></span>
            </button>
            <button class="btn btn-secondary btn-sm" @click="loadResources(true)" :disabled="loading"><span class="ic" x-html="ic('refresh')"></span>刷新</button>
          </div>
        </header>

        <!-- 汇总卡片：全部账号聚合模式 -->
        <div class="card" x-show="resources.mode==='all'">
          <div class="row" style="gap:24px;align-items:flex-end">
            <div>
              <p class="metric-label">总可用额度</p>
              <div class="total-num" x-text="fmtDosage(resources.total_dosage)"></div>
            </div>
            <div x-show="resources.expiring_7d>0 || resources.earliest_expire_at>0">
              <p class="metric-label">7 日内临期 / 最早到期</p>
              <div class="row" style="gap:8px;margin-top:6px">
                <span class="badge badge-warn" x-show="resources.expiring_7d>0"
                      x-text="'7日内临期 '+fmtDosage(resources.expiring_7d)"></span>
                <span class="badge"
                      :class="isExpiringSoon(resources.earliest_expire_at)?'badge-warn':'badge-muted'"
                      x-show="resources.earliest_expire_at>0"
                      x-text="'最早 '+expireHint(resources.earliest_expire_at, 0)"></span>
              </div>
            </div>
            <div class="spacer"></div>
            <span class="muted-xs" x-text="resourceCountText()"></span>
          </div>

          <div class="acct-pills" x-show="(resources.accounts_summary||[]).length">
            <template x-for="s in (resources.accounts_summary||[])" :key="s.uid">
              <button type="button" class="acct-pill" @click="selectResourceUID(s.uid)"
                      :title="s.error ? ('查询失败：'+s.error) : '点击查看该账号额度明细'">
                <span x-text="s.label||accountLabel(s)"></span>
                <span class="badge badge-ok" x-show="s.active">主</span>
                <span class="badge badge-err" x-show="s.error">失败</span>
                <span class="acct-pill-val" x-show="!s.error" x-text="fmtDosage(s.total_dosage)"></span>
                <span class="badge badge-warn" x-show="!s.error && isExpiringSoon(s.earliest_expire_at)"
                      x-text="expireHint(s.earliest_expire_at, s.expiring_credits)"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- 汇总卡片：单账号模式 -->
        <div class="card" x-show="resources.mode!=='all'">
          <div class="row" style="gap:20px">
            <div>
              <div class="row" style="gap:8px">
                <p class="metric-label">可用额度</p>
                <span class="badge badge-muted" x-show="resources.label" x-text="resources.label"></span>
              </div>
              <div class="total-num" x-text="fmtDosage(resources.total_dosage)"></div>
              <!-- 官方 TotalDosage 按账户级剩余聚合，含周期外/已过期额度；与本地聚合一致、或上游字段缺失/为 0 时隐藏 -->
              <p class="muted-xs" style="margin-top:4px"
                 x-show="resources.upstream_total_dosage>0 && resources.upstream_total_dosage!=resources.total_dosage"
                 title="官方 TotalDosage 按账户级剩余聚合，包含周期外/已过期额度，仅供参考"
                 x-text="'官方 TotalDosage：'+fmtDosage(resources.upstream_total_dosage)"></p>
            </div>
            <div class="spacer"></div>
            <button type="button" class="btn btn-ghost btn-sm" @click="selectResourceUID('all')">返回全部账号</button>
            <span class="muted-xs" x-text="resourceCountText()"></span>
          </div>
        </div>

        <div class="grid g2">
          <template x-for="a in resourceAccounts" :key="a.key">
            <div class="card">
              <div class="card-head">
                <h3 class="truncate" x-text="a.package_name||'额度包'"></h3>
                <button type="button" class="badge badge-muted clickable"
                        x-show="resources.mode==='all' && a.account_label"
                        @click="selectResourceUID(a.account_uid)"
                        x-text="a.account_label" title="只看该账号的额度包"></button>
                <div class="spacer"></div>
                <span class="badge" :class="quotaBadge(a)" x-text="quotaBadgeText(a)"></span>
              </div>
              <div class="bar"><div :class="quotaBarClass(a)" :style="'width:'+pct(a)+'%'"></div></div>
              <div class="row muted-xs" style="margin-top:10px;gap:14px">
                <span x-text="'剩余 '+fmtDosage(a.capacity_remain)"></span>
                <span x-text="'总量 '+fmtDosage(a.capacity_size)"></span>
                <span x-text="'已用 '+fmtDosage(a.capacity_used)"></span>
                <span x-show="a.capacity_unit" x-text="a.capacity_unit"></span>
              </div>
              <p class="muted-xs" style="margin-top:6px" x-text="'到期：'+quotaExpire(a)"></p>
            </div>
          </template>
        </div>
        <div class="empty" x-show="resources.loaded && !(resources.accounts||[]).length">
          <span class="ic ic-lg" x-html="ic('wallet')"></span>暂无额度包数据（若持续为空，请检查凭证后刷新）
        </div>
        <div class="empty" x-show="resources.loaded && resourceAccounts.length===0 && resourceHiddenCount>0">
          <span class="ic ic-lg" x-html="ic('wallet')"></span>
          <span x-text="resourceHiddenCount+' 个额度包已用完，当前被隐藏'"></span>
          <button class="btn btn-secondary btn-sm" @click="toggleHideDepleted()"><span class="ic" x-html="ic('eye')"></span>显示全部</button>
        </div>
        <div class="empty" x-show="!resources.loaded"><span class="spin" style="width:18px;height:18px"></span>加载中…</div>
      </section>
