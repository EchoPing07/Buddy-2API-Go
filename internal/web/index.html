<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy-2API · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4 7 4 4 20 4 20 7'/%3E%3Cline x1='9' x2='15' y1='20' y2='20'/%3E%3Cline x1='12' x2='12' y1='4' y2='20'/%3E%3C/svg%3E">
<script defer src="/assets/alpine.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   设计令牌（参考 grok2api / shadcn · 极简黑白 · oklch）
   ═══════════════════════════════════════════════════════════════ */
:root{
  --radius:8px;
  /* 字号阶梯：11 / 12 / 13 / 14 / 16 / 20 / 24 / 28（禁止使用阶梯外尺寸） */
  --fs-2xs:11px;--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;--fs-3xl:28px;
  /* 图标阶梯：14 / 16 / 20 */
  --icon-sm:14px;--icon:16px;--icon-lg:20px;
  --bg:oklch(.984 0 0);
  --fg:oklch(.21 0 0);
  --card:oklch(.997 0 0);
  --popover:oklch(1 0 0);
  --secondary:oklch(.962 .003 90);
  --secondary-fg:oklch(.28 0 0);
  --muted-fg:oklch(.53 0 0);
  --accent:oklch(.945 .004 90);
  --primary:oklch(.22 0 0);
  --primary-fg:oklch(.985 0 0);
  --destructive:oklch(.577 .215 27);
  --border:oklch(.912 0 0);
  --input:oklch(.9 0 0);
  --sidebar:oklch(.995 0 0);
  --sidebar-border:oklch(.932 0 0);
  --ok-fg:oklch(.55 .12 162);
  --ok-bg:color-mix(in oklab,oklch(.7 .15 162) 13%,transparent);
  --warn-fg:oklch(.55 .12 70);
  --warn-bg:color-mix(in oklab,oklch(.78 .15 75) 18%,transparent);
  --err-fg:oklch(.55 .19 25);
  --err-bg:color-mix(in oklab,oklch(.66 .2 25) 11%,transparent);
  --chart-bar:color-mix(in oklab,oklch(.5 0 0) 22%,transparent);
  --chart-bar-hl:color-mix(in oklab,oklch(.5 0 0) 42%,transparent);
  --bar-fill:oklch(.75 .15 75);
  --chevron:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238a8a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  color-scheme:light;
}
.dark{
  --bg:oklch(.135 0 0);
  --fg:oklch(.955 0 0);
  --card:oklch(.182 0 0);
  --popover:oklch(.172 0 0);
  --secondary:oklch(.215 0 0);
  --secondary-fg:oklch(.94 0 0);
  --muted-fg:oklch(.635 0 0);
  --accent:oklch(.245 0 0);
  --primary:oklch(.955 0 0);
  --primary-fg:oklch(.16 0 0);
  --destructive:oklch(.66 .19 25);
  --border:oklch(.272 0 0);
  --input:oklch(.3 0 0);
  --sidebar:oklch(.148 0 0);
  --sidebar-border:oklch(.25 0 0);
  --ok-fg:oklch(.78 .12 162);
  --ok-bg:color-mix(in oklab,oklch(.7 .15 162) 16%,transparent);
  --warn-fg:oklch(.8 .12 75);
  --warn-bg:color-mix(in oklab,oklch(.75 .15 75) 16%,transparent);
  --err-fg:oklch(.72 .17 25);
  --err-bg:color-mix(in oklab,oklch(.65 .2 25) 15%,transparent);
  --chart-bar:color-mix(in oklab,oklch(.75 0 0) 20%,transparent);
  --chart-bar-hl:color-mix(in oklab,oklch(.75 0 0) 40%,transparent);
  --bar-fill:oklch(.7 .13 75);
  --chevron:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  color-scheme:dark;
}

/* ── 基础 ── */
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:5px;height:5px}
*::-webkit-scrollbar-thumb{border-radius:5px;background:var(--border)}
*::-webkit-scrollbar-track{background:transparent}
html,body{min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in oklab,var(--primary) 22%,transparent)}
:focus-visible{outline:2px solid color-mix(in oklab,var(--fg) 55%,transparent);outline-offset:2px}
[x-cloak]{display:none!important}
.mono,code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:var(--fs-xs)}
.muted{color:var(--muted-fg)}
.muted-xs{font-size:var(--fs-2xs);color:var(--muted-fg)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{white-space:normal;word-break:break-all}

/* ── 图标 ── */
.ic{display:inline-flex;flex-shrink:0;line-height:0}
.ic svg{width:var(--icon);height:var(--icon)}
.ic-sm svg{width:var(--icon-sm);height:var(--icon-sm)}
.ic-lg svg{width:var(--icon-lg);height:var(--icon-lg)}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--radius);border:1px solid transparent;background:var(--primary);color:var(--primary-fg);font-size:var(--fs-sm);font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;user-select:none;transition:background .15s,color .15s,opacity .15s}
.btn:hover{opacity:.86}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn>svg,.btn .ic svg{width:var(--icon-sm);height:var(--icon-sm);flex-shrink:0}
.btn-secondary{background:var(--secondary);color:var(--secondary-fg)}
.btn-secondary:hover{background:var(--accent);opacity:1}
.btn-ghost{background:transparent;color:var(--muted-fg)}
.btn-ghost:hover{background:var(--secondary);color:var(--fg);opacity:1}
.btn-outline{background:transparent;border-color:var(--border);color:var(--muted-fg)}
.btn-outline:hover{background:var(--secondary);color:var(--fg);opacity:1}
.btn-danger{background:transparent;color:var(--destructive);border-color:color-mix(in oklab,var(--destructive) 32%,transparent)}
.btn-danger:hover{background:var(--err-bg);opacity:1}
.btn-sm{height:28px;padding:0 10px;font-size:var(--fs-xs);border-radius:7px}
.btn-icon{width:32px;padding:0}
.btn-sm.btn-icon{width:28px}

/* ── 表单 ── */
.label{display:block;font-size:var(--fs-xs);font-weight:500;color:var(--muted-fg);margin-bottom:6px}
.input,.select{height:34px;width:100%;border-radius:var(--radius);border:1px solid var(--input);background:var(--bg);color:var(--fg);padding:0 11px;font-size:var(--fs-sm);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:color-mix(in oklab,var(--muted-fg) 60%,transparent)}
.input:focus,.select:focus{border-color:color-mix(in oklab,var(--fg) 32%,var(--input));box-shadow:0 0 0 3px color-mix(in oklab,var(--input) 28%,transparent)}
.input:disabled{opacity:.55;cursor:not-allowed}
.select{appearance:none;background-image:var(--chevron);background-repeat:no-repeat;background-position:right 10px center;padding-right:30px;cursor:pointer}
.input-sm,.select-sm{height:30px;font-size:var(--fs-xs);border-radius:7px}
.form-row{margin-bottom:14px}
.form-grid{display:grid;gap:0 12px}
@media(min-width:640px){.form-grid.c2{grid-template-columns:1fr 1fr}}
.field-hint{margin-top:5px;font-size:var(--fs-2xs);color:var(--muted-fg);line-height:1.5}
.switch{width:36px;height:20px;border-radius:9999px;background:var(--input);position:relative;cursor:pointer;transition:background .2s;border:none;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:9999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(16px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 16px}
.sw-label{font-size:var(--fs-sm)}

/* ── 徽章 / 状态 ── */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:9999px;font-size:var(--fs-2xs);font-weight:500;line-height:1;white-space:nowrap;border:none;font-family:inherit;cursor:default}
.badge-ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge-warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge-err{background:var(--err-bg);color:var(--err-fg)}
.badge-muted{background:var(--secondary);color:var(--muted-fg)}
.badge.clickable{cursor:pointer;transition:filter .15s}
.badge.clickable:hover{filter:brightness(1.06)}

/* ── 卡片 / 页面 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 2px rgb(0 0 0/.03)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:20px}
.card-head h3{font-size:var(--fs-md);font-weight:600;letter-spacing:-.01em}
.space{display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.page-head h1{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.015em}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.metrics{grid-template-columns:1fr}
.metrics-4{grid-template-columns:1fr}
@media(min-width:640px){.metrics,.metrics-4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.metrics{grid-template-columns:repeat(5,1fr)}.metrics-4{grid-template-columns:repeat(4,1fr)}}
.charts{grid-template-columns:1fr}
@media(min-width:1024px){.charts{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.g2{grid-template-columns:1fr}
@media(min-width:900px){.g2{grid-template-columns:repeat(2,1fr)}}
.settings-grid{grid-template-columns:1fr}
.settings-grid>.space{gap:12px}
@media(min-width:1024px){.settings-grid{grid-template-columns:repeat(2,1fr);align-items:start}}
.metric{min-height:112px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgb(0 0 0/.03)}
.metric-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.metric-label{font-size:var(--fs-xs);font-weight:500;color:var(--muted-fg)}
.metric-head .ic svg{color:var(--muted-fg);opacity:.8}
.metric-value{margin-top:10px;font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:32px}
.metric-detail{margin-top:4px;font-size:var(--fs-2xs);color:var(--muted-fg);min-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.total-num{font-size:var(--fs-3xl);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}

/* ── 表格 ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
th{font-weight:500;color:var(--muted-fg);text-align:left;padding:0 10px 9px;white-space:nowrap;border-bottom:1px solid var(--border);font-size:var(--fs-2xs);letter-spacing:.01em}
td{padding:10px;border-bottom:1px solid color-mix(in oklab,var(--border) 55%,transparent);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in oklab,var(--secondary) 55%,transparent)}
.cell-edit{height:26px;border:1px solid transparent;background:transparent;color:var(--fg);font-size:var(--fs-xs);font-family:inherit;border-radius:6px;padding:0 7px;width:130px;outline:none;transition:border-color .15s,background .15s}
.cell-edit:hover{border-color:var(--input)}
.cell-edit:focus{border-color:color-mix(in oklab,var(--fg) 30%,var(--input));background:var(--popover)}
.key-chip{background:var(--secondary);padding:3px 8px;border-radius:6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .input,.filters .select{width:auto}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;font-size:var(--fs-xs);color:var(--muted-fg)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 0;color:var(--muted-fg);font-size:var(--fs-sm)}
.empty .ic svg{opacity:.55}
.kv-grid{display:grid;grid-template-columns:1fr;gap:2px 36px}
@media(min-width:700px){.kv-grid{grid-template-columns:1fr 1fr}}
.kv{display:flex;gap:14px;padding:7px 0;font-size:var(--fs-sm);align-items:baseline}
.kv .k{width:110px;flex-shrink:0;color:var(--muted-fg);font-size:var(--fs-xs)}
.kv .v{min-width:0;word-break:break-all}

/* ── 布局：侧边栏 + 内容 ── */
.shell{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:22px 14px 14px;z-index:50;transition:transform .25s ease}
.side-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;backdrop-filter:blur(1px)}
@media(max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}
}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:28px}
.logo{display:flex;align-items:center;gap:8px;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.02em;cursor:pointer}
.sidenav{margin-top:26px;flex:1;overflow-y:auto;padding:0 4px 8px;display:flex;flex-direction:column;gap:2px}
.nav-link{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:var(--fs-sm);color:var(--muted-fg);cursor:pointer;transition:background .12s,color .12s}
.nav-link:hover{background:color-mix(in oklab,var(--secondary) 55%,transparent);color:var(--fg)}
.nav-link.active{background:var(--secondary);color:var(--fg);font-weight:500}
.nav-link .ic{width:20px;justify-content:center}
.nav-link .ic svg{width:var(--icon);height:var(--icon)}
.side-foot{flex-shrink:0;padding:12px 8px 2px;border-top:1px solid color-mix(in oklab,var(--sidebar-border) 70%,transparent)}
.side-actions{display:flex;gap:8px}
.side-actions .btn{flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:30}
@media(min-width:1024px){.topbar{display:none}}
.content{min-height:100vh;display:flex;flex-direction:column}
@media(min-width:1024px){.content{padding-left:260px}}
.main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:26px 20px 76px}
@media(min-width:640px){.main{padding:30px 32px 76px}}
.splash{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted-fg)}

/* ── 登录页 ── */
.login-page{min-height:100vh;display:flex;flex-direction:column}
.login-main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:960px;margin:0 auto;padding:40px 24px}
.login-grid{width:100%;max-width:840px;display:grid;gap:40px;align-items:center}
@media(min-width:1024px){.login-grid{grid-template-columns:minmax(0,1fr) 1px 336px;transform:translateY(-16px)}}
.login-brand{display:none;min-height:280px;flex-direction:column;justify-content:center}
@media(min-width:1024px){.login-brand{display:flex}}
.login-divider{display:none;background:var(--border);height:256px}
@media(min-width:1024px){.login-divider{display:block}}
.login-brand-title{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;margin:0 0 2px}
.login-sub{margin-top:14px;font-size:var(--fs-sm);line-height:1.7;color:var(--muted-fg);max-width:340px}
.login-form-col{width:100%;max-width:336px;margin:0 auto}
.login-h1{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.015em}

/* ── 进度条 / 图表 ── */
.bar{height:7px;border-radius:9999px;background:color-mix(in oklab,var(--muted-fg) 14%,transparent);overflow:hidden}
.bar>div{height:100%;border-radius:9999px;background:var(--fg);transition:width .4s ease}
.bar>div.warn{background:var(--bar-fill)}
.bar>div.err{background:var(--err-fg)}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%}
.axis-label{fill:var(--muted-fg);font-size:10px;font-family:inherit}
.grid-line{stroke:color-mix(in oklab,var(--border) 75%,transparent)}
.bar-c{fill:var(--chart-bar);transition:fill .15s}
.bar-c.hl{fill:var(--chart-bar-hl)}
.tok-line{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tok-dot{fill:var(--card);stroke:var(--fg);stroke-width:1.4}
.tip-bg{fill:var(--popover);stroke:color-mix(in oklab,var(--border) 80%,transparent)}
.tip-t{fill:var(--fg);font-size:11px;font-weight:600}
.tip-l{fill:var(--muted-fg);font-size:10px}
.chart-empty{display:flex;align-items:center;justify-content:center;height:236px;color:var(--muted-fg);font-size:12px}
.legend{display:flex;align-items:center;gap:12px;font-size:var(--fs-2xs);color:var(--muted-fg)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px}
.lg-bar i{background:var(--chart-bar-hl)}
.lg-line i{height:3px;border-radius:2px;background:var(--fg)}
.model-row{display:grid;grid-template-columns:minmax(72px,128px) 1fr 52px;align-items:center;gap:10px;padding:7px 0}
.model-row+.model-row{border-top:1px solid color-mix(in oklab,var(--border) 45%,transparent)}
.model-name{font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-track{height:6px;border-radius:9999px;background:color-mix(in oklab,var(--muted-fg) 12%,transparent);overflow:hidden}
.model-fill{height:100%;border-radius:9999px;background:var(--fg);opacity:.82;transition:width .4s}
.model-count{font-size:var(--fs-2xs);color:var(--muted-fg);text-align:right;font-variant-numeric:tabular-nums}
.model-chips{display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.model-chip{display:inline-flex;align-items:center;gap:6px;background:var(--secondary);border:1px solid color-mix(in oklab,var(--border) 60%,transparent);border-radius:7px;padding:5px 9px;font-size:var(--fs-xs);line-height:1.4;max-width:100%}
.model-chip .model-chip-name{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.model-chip .model-chip-rate{color:var(--muted-fg);font-size:var(--fs-2xs)}
.file-input{font-size:var(--fs-xs);color:var(--muted-fg);max-width:240px}
.file-input::file-selector-button{margin-right:10px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--secondary);color:var(--secondary-fg);font-size:var(--fs-xs);cursor:pointer}
textarea.input{height:auto;padding:8px 11px;line-height:1.5}

/* ── OAuth / 其他组件 ── */
.oauth-desc{font-size:var(--fs-sm);color:var(--muted-fg);line-height:1.7;margin-bottom:16px;max-width:560px}
.oauth-box{border:1px dashed color-mix(in oklab,var(--muted-fg) 36%,transparent);border-radius:12px;padding:22px;text-align:center}
.oauth-box>p{font-size:var(--fs-sm);color:var(--muted-fg);margin-bottom:12px}
.oauth-url{background:var(--secondary);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:var(--fs-xs);word-break:break-all}
.oauth-url a{color:var(--fg)}
.oauth-url a:hover{text-decoration:underline}
.row-center{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.center-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:34px 20px}
.checkin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.checkin-grid{grid-template-columns:1fr}}
.checkin-item{display:flex;flex-direction:column;gap:3px}
.checkin-val{font-size:var(--fs-lg);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ── 弹窗 ── */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,10,14,.4);backdrop-filter:blur(3px)}
.modal{width:100%;max-width:420px;background:var(--popover);border:1px solid color-mix(in oklab,var(--border) 80%,transparent);border-radius:14px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:pop .16s ease-out}
.modal-title{font-size:var(--fs-lg);font-weight:600;margin-bottom:6px}
.modal-msg{font-size:var(--fs-sm);color:var(--muted-fg);line-height:1.65;margin-bottom:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1}}

/* ── 提示 / 动画 ── */
.toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:flex-start;gap:9px;max-width:360px;background:var(--popover);color:var(--fg);border:1px solid color-mix(in oklab,var(--border) 80%,transparent);border-radius:12px;padding:11px 14px;font-size:var(--fs-sm);box-shadow:0 10px 36px rgba(0,0,0,.14);animation:toastIn .22s cubic-bezier(.21,1.02,.73,1)}
.toast .ic{margin-top:2px}
.toast .ic svg{width:var(--icon-sm);height:var(--icon-sm)}
.toast-ok .ic{color:var(--ok-fg)}
.toast-err .ic{color:var(--err-fg)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1}}
.spin{display:inline-block;width:14px;height:14px;border-radius:9999px;border:2px solid color-mix(in oklab,currentColor 25%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
section[x-show]{animation:fadeUp .18s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div x-data="app()">

<!-- 启动加载 -->
<template x-if="!ready">
  <div class="splash" x-cloak><span class="spin" style="width:20px;height:20px"></span></div>
</template>

<!-- ═══ 登录页 ═══ -->
<template x-if="ready && !loggedIn">
<div class="login-page" x-cloak>
  <main class="login-main">
    <div class="login-grid">
      <section class="login-brand">
        <h1 class="login-brand-title">Buddy-2API</h1>
        <p class="login-sub">将 CodeBuddy 的 AI 服务封装为标准 OpenAI API 接口。</p>
      </section>
      <div class="login-divider" aria-hidden="true"></div>
      <section class="login-form-col">
        <h1 class="login-h1">登录</h1>
        <p class="login-sub" style="margin:8px 0 24px">输入管理密码进入后台</p>
        <form @submit.prevent="doLogin()">
          <div class="form-row">
            <label class="label" for="pw">管理密码</label>
            <input id="pw" class="input" type="password" x-model="password" placeholder="••••••••" autofocus autocomplete="current-password">
          </div>
          <button type="submit" class="btn" style="width:100%;height:36px" :disabled="loading">
            <span class="spin" x-show="loading"></span>
            <span x-show="!loading">登 录</span>
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
</template>

<!-- ═══ 主界面 ═══ -->
<template x-if="ready && loggedIn">
<div class="shell" x-cloak>

  <!-- 移动端顶栏 -->
  <header class="topbar">
    <button class="btn btn-ghost btn-icon" @click="mobileNav=true" aria-label="打开导航" x-html="ic('menu')"></button>
    <span class="logo">Buddy-2API</span>
    <button class="btn btn-outline btn-sm" @click="cycleTheme()" :title="'点击切换主题（当前：'+themeLabel+'）'">
      <span class="ic" x-html="ic(theme==='light'?'sun':theme==='dark'?'moon':'monitor')"></span>
      <span x-text="themeLabel"></span>
    </button>
  </header>

  <!-- 侧边栏 -->
  <div class="side-backdrop" x-show="mobileNav" x-transition.opacity @click="mobileNav=false"></div>
  <aside class="sidebar" :class="{'open':mobileNav}">
    <div class="side-head">
      <a class="logo" @click="go('dashboard')">Buddy-2API</a>
    </div>
    <nav class="sidenav" aria-label="主导航">
      <template x-for="n in nav" :key="n.id">
        <a class="nav-link" :class="{active:view===n.id}" @click="go(n.id)">
          <span class="ic" x-html="ic(n.icon)"></span>
          <span x-text="n.label"></span>
        </a>
      </template>
    </nav>
    <div class="side-foot">
      <div class="side-actions">
        <button class="btn btn-outline btn-sm" @click="cycleTheme()" :title="'点击切换主题（当前：'+themeLabel+'）'">
          <span class="ic" x-html="ic(theme==='light'?'sun':theme==='dark'?'moon':'monitor')"></span>
          <span x-text="themeLabel"></span>
        </button>
        <button class="btn btn-outline btn-sm" @click="logout()"><span class="ic" x-html="ic('logout')"></span>退出</button>
      </div>
    </div>
  </aside>

  <!-- 内容区 -->
  <div class="content">
    <main class="main">

      <!-- ── 仪表盘 ── -->
      <section x-show="view==='dashboard'" x-cloak class="space">
        <header class="page-head">
          <h1>统计</h1>
          <div class="page-actions">
            <button class="btn btn-secondary btn-sm" @click="loadStats()" :disabled="loading">
              <span class="ic" x-html="ic('refresh')"></span>刷新统计
            </button>
          </div>
        </header>

        <div class="grid metrics-4">
          <article class="metric">
            <header class="metric-head"><span class="metric-label">总请求</span><span class="ic" x-html="ic('activity')"></span></header>
            <div class="metric-value" x-text="fmt(stats.total_requests)"></div>
            <p class="metric-detail" x-text="'今日 '+fmt(stats.today_requests)+' · 日均 '+compact(avg14)"></p>
          </article>
          <article class="metric">
            <header class="metric-head"><span class="metric-label">Tokens 用量</span><span class="ic" x-html="ic('type')"></span></header>
            <div class="metric-value" x-text="fmt(stats.total_tokens)"></div>
            <p class="metric-detail" x-text="'今日 '+fmt(stats.today_tokens)"></p>
          </article>
          <article class="metric">
            <header class="metric-head"><span class="metric-label">错误数</span><span class="ic" x-html="ic('alert')"></span></header>
            <div class="metric-value" x-text="fmt(stats.error_count)"></div>
            <p class="metric-detail" x-text="successRate!==null ? '成功率 '+successRate+'%' : '—'"></p>
          </article>
          <article class="metric">
            <header class="metric-head"><span class="metric-label">Credits 消耗</span><span class="ic" x-html="ic('dollar')"></span></header>
            <div class="metric-value" x-text="fmt(stats.total_credit)"></div>
            <p class="metric-detail" x-text="keys.length+' 个 Key · '+(stats.by_model||[]).length+' 个模型'"></p>
          </article>
        </div>

        <div class="grid charts">
          <div class="card">
            <div class="card-head">
              <h3>近 14 天用量</h3>
              <div class="spacer"></div>
              <div class="legend">
                <span class="lg lg-bar"><i></i>Tokens 用量</span>
                <span class="lg lg-line"><i></i>请求数</span>
              </div>
            </div>
            <div id="chartDaily" class="chart-box"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <h3>模型用量 Top 10</h3>
              <div class="spacer"></div>
              <span class="muted-xs" x-text="(stats.by_model||[]).length+' 个模型'"></span>
            </div>
            <div x-show="topModels.length">
              <template x-for="m in topModels" :key="m.model">
                <div class="model-row">
                  <span class="model-name" :title="m.model" x-text="m.model"></span>
                  <div class="model-track"><div class="model-fill" :style="'width:'+Math.max(2,m.requests/maxReq*100)+'%'"></div></div>
                  <span class="model-count" x-text="fmt(m.requests)"></span>
                </div>
              </template>
            </div>
            <div class="empty" x-show="!topModels.length"><span class="ic ic-lg" x-html="ic('box')"></span>暂无调用数据</div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>模型列表</h3>
            <div class="spacer"></div>
            <span class="muted-xs" x-show="models.state" x-text="modelsStateText"></span>
            <button class="btn btn-secondary btn-sm" @click="refreshModels()" :disabled="loading"><span class="ic" x-html="ic('refresh')"></span>刷新</button>
          </div>
          <div x-show="!models.loading && modelChips.length">
            <div class="model-chips">
              <template x-for="m in modelChips" :key="m.id">
                <span class="model-chip" :title="m.id + (m.promo ? ' · ' + m.promo : '')">
                  <span class="model-chip-name" x-text="m.disp"></span>
                  <span class="model-chip-rate" x-show="m.credits" x-text="m.credits"></span>
                </span>
              </template>
            </div>
          </div>
          <div class="empty" x-show="!models.loading && !modelChips.length">
            <span class="ic ic-lg" x-html="ic('box')"></span>暂无模型
          </div>
          <div class="empty" x-show="models.loading"><span class="spin" style="width:18px;height:18px"></span>加载中…</div>
        </div>

        <div class="card">
          <div class="card-head"><h3>近期错误</h3></div>
          <div class="table-wrap" x-show="(stats.recent_errors||[]).length">
            <table>
              <thead><tr><th>时间</th><th>模型</th><th>Key</th><th>状态码</th><th>错误信息</th></tr></thead>
              <tbody>
                <template x-for="l in (stats.recent_errors||[])" :key="l.id">
                  <tr>
                    <td class="muted-xs" x-text="ts(l.created_at)"></td>
                    <td x-text="l.model||'—'"></td>
                    <td class="muted-xs" x-text="l.api_key_name||'—'"></td>
                    <td><span class="badge badge-err" x-text="l.status_code"></span></td>
                    <td class="muted-xs wrap" style="max-width:340px" x-text="l.error_msg"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="empty" x-show="!(stats.recent_errors||[]).length">
            <span class="ic ic-lg" x-html="ic('shield')"></span>运行正常，暂无错误
          </div>
        </div>
      </section>

      <!-- ── 账号 ── -->
      <section x-show="view==='account'" x-cloak class="space">
        <header class="page-head">
          <h1>账号</h1>
          <div class="page-actions">
            <button class="btn btn-secondary btn-sm" @click="exportAccount()" :disabled="loading"><span class="ic" x-html="ic('upload')"></span>导出凭证</button>
            <button class="btn btn-secondary btn-sm" @click="importModal=true"><span class="ic" x-html="ic('download')"></span>导入凭证</button>
            <template x-if="account.logged_in">
              <button class="btn btn-secondary btn-sm" @click="refreshToken()" :disabled="loading"><span class="ic" x-html="ic('refresh')"></span>刷新 Token</button>
            </template>
            <template x-if="account.logged_in">
              <button class="btn btn-secondary btn-sm" @click="testAccount()" :disabled="loading"><span class="ic" x-html="ic('shield')"></span>测试连通</button>
            </template>
            <template x-if="account.logged_in">
              <button class="btn btn-danger btn-sm" @click="deleteAccount()" :disabled="loading"><span class="ic" x-html="ic('logout')"></span>退出登录</button>
            </template>
          </div>
        </header>

        <template x-if="account.logged_in">
          <div class="card">
            <div class="card-head">
              <h3>OAuth 凭证</h3>
              <span class="badge" :class="account.expired?'badge-err':'badge-ok'" x-text="account.expired?'已过期':'正常'"></span>
              <span class="badge" :class="account.region_match?'badge-muted':'badge-warn'" x-text="account.region_match?'与当前端点匹配':'凭证属于另一端点'"></span>
              <div class="spacer"></div>
              <span class="muted-xs" x-text="'uid '+(account.uid||'—')"></span>
            </div>
            <div class="kv-grid">
              <div class="kv"><span class="k">昵称</span><span class="v" x-text="account.nickname||'—'"></span></div>
              <div class="kv"><span class="k">enterprise_id</span><span class="v" x-text="account.enterprise_id||'（个人账号）'"></span></div>
              <div class="kv"><span class="k">domain</span><span class="v" x-text="account.domain||'—'"></span></div>
              <div class="kv"><span class="k">access_token</span><span class="v mono" x-text="account.access_token"></span></div>
              <div class="kv"><span class="k">refresh_token</span><span class="v" x-text="account.has_refresh?'已保存':'无'"></span></div>
              <div class="kv"><span class="k">过期时间</span><span class="v" x-text="account.expires_human+(account.expires_at?'（'+ts(account.expires_at)+'）':'')"></span></div>
            </div>
          </div>
        </template>

        <div class="card">
          <div class="card-head"><h3 x-text="account.logged_in?'重新登录':'登录'"></h3></div>
          <template x-if="!oauth.state">
            <div>
              <p class="oauth-desc">点击开始后，在打开的浏览器页面中完成授权登录。凭证仅保存在本地 data 目录。</p>
              <button class="btn" @click="oauthStart()" :disabled="loading"><span class="ic" x-html="ic('external')"></span>开始登录</button>
            </div>
          </template>
          <template x-if="oauth.state">
            <div class="oauth-box">
              <p>请在浏览器中打开以下链接完成授权：</p>
              <div class="oauth-url"><a :href="oauth.auth_url" target="_blank" rel="noreferrer" x-text="oauth.auth_url"></a></div>
              <div class="row-center">
                <a :href="oauth.auth_url" target="_blank" rel="noreferrer"><button class="btn btn-secondary btn-sm"><span class="ic" x-html="ic('external')"></span>打开授权页面</button></a>
                <button class="btn btn-ghost btn-sm" @click="copy(oauth.auth_url)"><span class="ic" x-html="ic('copy')"></span>复制链接</button>
                <span class="muted-xs" x-text="oauth.poll_msg"></span>
                <button class="btn btn-ghost btn-sm" @click="oauthCancel()">取消</button>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- ── Keys ── -->
      <section x-show="view==='keys'" x-cloak class="space">
        <header class="page-head">
          <h1>密钥</h1>
          <div class="page-actions">
            <button class="btn btn-sm" @click="keyModal=true"><span class="ic" x-html="ic('plus')"></span>创建 Key</button>
          </div>
        </header>

        <div class="card">
          <div class="table-wrap" x-show="keys.length">
            <table>
              <thead><tr><th>Key</th><th>备注</th><th>请求数</th><th>Tokens</th><th>状态</th><th></th></tr></thead>
              <tbody>
                <template x-for="k in keys" :key="k.id">
                  <tr>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <code class="key-chip" :title="k.key_plain" x-text="k.key_plain"></code>
                        <button class="btn btn-ghost btn-sm" @click="copy(k.key_plain)">复制</button>
                      </div>
                    </td>
                    <td><input class="cell-edit" x-model="k.name" placeholder="备注" @change="updateKey(k,{name:k.name})"></td>
                    <td x-text="fmt(k.total_requests)"></td>
                    <td x-text="fmt(k.total_tokens)"></td>
                    <td>
                      <button class="badge clickable" :class="k.status==='active'?'badge-ok':'badge-muted'"
                              @click="updateKey(k,{status:k.status==='active'?'disabled':'active'})"
                              x-text="k.status==='active'?'启用':'停用'"></button>
                    </td>
                    <td><button class="btn btn-ghost btn-sm" style="color:var(--destructive)" @click="deleteKey(k)">删除</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="empty" x-show="!keys.length">
            <span class="ic ic-lg" x-html="ic('keys')"></span>
            还没有 Key，点击右上角创建
          </div>
        </div>
      </section>

      <!-- ── 余额 ── -->
      <section x-show="view==='resources'" x-cloak class="space">
        <header class="page-head">
          <h1>余额</h1>
          <div class="page-actions">
            <span class="muted-xs" x-show="resources.updated_at" x-text="'更新于 '+ts(resources.updated_at)"></span>
            <button class="btn btn-secondary btn-sm" @click="loadResources(true)" :disabled="loading"><span class="ic" x-html="ic('refresh')"></span>刷新</button>
          </div>
        </header>

        <div class="card">
          <div class="row" style="gap:20px">
            <div>
              <p class="metric-label">可用额度</p>
              <div class="total-num" x-text="fmtDosage(resources.total_dosage)"></div>
              <!-- 官方 TotalDosage 按账户级剩余聚合，含周期外/已过期额度；与本地聚合一致、或上游字段缺失/为 0 时隐藏 -->
              <p class="muted-xs" style="margin-top:4px"
                 x-show="resources.upstream_total_dosage>0 && resources.upstream_total_dosage!=resources.total_dosage"
                 title="官方 TotalDosage 按账户级剩余聚合，包含周期外/已过期额度，仅供参考"
                 x-text="'官方 TotalDosage：'+fmtDosage(resources.upstream_total_dosage)"></p>
            </div>
            <div class="spacer"></div>
            <span class="muted-xs" x-text="(resources.accounts||[]).length+' 个额度包'"></span>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>每日签到</h3>
            <span class="badge" :class="checkin.today_checked_in?'badge-ok':'badge-muted'" x-text="checkin.today_checked_in?'今日已签到':'未签到'"></span>
            <div class="spacer"></div>
            <button class="btn btn-sm" :class="checkin.today_checked_in?'btn-secondary':''" @click="claimCheckin()" :disabled="loading||checkin.today_checked_in">
              <span class="ic" x-html="ic(checkin.today_checked_in?'check':'checkin')"></span>
              <span x-text="checkin.today_checked_in?'已签到':'立即签到'"></span>
            </button>
          </div>
          <div class="checkin-grid">
            <div class="checkin-item"><span class="metric-label">活动状态</span><span class="checkin-val" x-text="checkin.active?'进行中':'未开启'"></span></div>
            <div class="checkin-item"><span class="metric-label">今日积分</span><span class="checkin-val" x-text="checkin.today_credit ?? '—'"></span></div>
            <div class="checkin-item"><span class="metric-label">连续签到</span><span class="checkin-val" x-text="(checkin.streak_days ?? 0)+' 天'"></span></div>
          </div>
          <p class="field-hint" x-text="checkinHint()"></p>
        </div>

        <div class="grid g2">
          <template x-for="(a,i) in (resources.accounts||[])" :key="i">
            <div class="card">
              <div class="card-head">
                <h3 class="truncate" x-text="a.package_name||'额度包'"></h3>
                <div class="spacer"></div>
                <span class="badge" :class="quotaBadge(a)" x-text="quotaBadgeText(a)"></span>
              </div>
              <div class="bar"><div :class="quotaBarClass(a)" :style="'width:'+pct(a)+'%'"></div></div>
              <div class="row muted-xs" style="margin-top:10px;gap:14px">
                <span x-text="'剩余 '+fmtDosage(a.capacity_remain)"></span>
                <span x-text="'总量 '+fmtDosage(a.capacity_size)"></span>
                <span x-text="'已用 '+fmtDosage(a.capacity_used)"></span>
                <span x-show="a.capacity_unit" x-text="a.capacity_unit"></span>
              </div>
              <p class="muted-xs" style="margin-top:6px" x-text="'到期：'+quotaExpire(a)"></p>
            </div>
          </template>
        </div>
        <div class="empty" x-show="resources.loaded && !(resources.accounts||[]).length">
          <span class="ic ic-lg" x-html="ic('wallet')"></span>暂无额度包数据（若持续为空，请检查凭证后刷新）
        </div>
        <div class="empty" x-show="!resources.loaded"><span class="spin" style="width:18px;height:18px"></span>加载中…</div>
      </section>

      <!-- ── 日志 ── -->
      <section x-show="view==='logs'" x-cloak class="space">
        <header class="page-head">
          <h1>日志</h1>
          <div class="page-actions"><span class="muted-xs" x-text="'共 '+logTotal+' 条'"></span></div>
        </header>

        <div class="card">
          <div class="filters">
            <input class="input input-sm" style="width:170px" x-model="logFilter.model" @input="loadLogsDebounced()" placeholder="模型（模糊匹配）">
            <select class="select select-sm" style="width:150px" x-model="logFilter.key_id" @change="loadLogs(1)">
              <option value="">全部 Key</option>
              <template x-for="k in keys" :key="k.id"><option :value="k.id" x-text="k.name||('#'+k.id)"></option></template>
            </select>
            <select class="select select-sm" style="width:130px" x-model="logFilter.status" @change="loadLogs(1)">
              <option value="">全部状态</option>
              <option value="error">仅错误</option>
              <option value="200">200</option>
              <option value="401">401</option>
              <option value="429">429</option>

  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',

function app(){
  return {
    /* ── 状态 ── */
    ready:false, loggedIn:false, loading:false, password:'',
    view:'dashboard', mobileNav:false, toasts:[], _toastSeq:0,
    theme: localStorage.getItem('buddy2api:theme') || 'system',
    health:{}, stats:{}, account:{}, keys:[],
    logs:[], logTotal:0, logPage:1, logPageSize:20,
    logFilter:{model:'',key_id:'',status:''}, _logT:0,
    keyForm:{name:'',custom_key:''}, keyModal:false,
    resources:{accounts:[],loaded:false},
    checkin:{loaded:false},
    settings:{}, pwForm:{old_password:'',new_password:''},
    models:{models:[],ids:[],state:null,loading:false},
    importModal:false, importForm:{access_token:'',refresh_token:'',domain:'',filename:''},
    confirmBox:{open:false,title:'',message:'',onOk:null},
    oauth:{state:'',auth_url:'',poll_msg:'等待授权中…',_timer:null,_deadline:0},
    _chartGeom:null,

    nav:[
      {id:'dashboard',label:'统计',icon:'dashboard'},
      {id:'account',label:'账号',icon:'account'},
      {id:'keys',label:'密钥',icon:'keys'},
      {id:'resources',label:'余额',icon:'wallet'},
      {id:'logs',label:'日志',icon:'logs'},
      {id:'settings',label:'设置',icon:'settings'},
    ],

    /* ── 主题 ── */
    get themeLabel(){ return this.theme==='light'?'浅色':this.theme==='dark'?'深色':'系统' },
    applyTheme(){
      const dark = this.theme==='dark' || (this.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    },
    cycleTheme(){
      this.theme = this.theme==='light'?'dark':this.theme==='dark'?'system':'light';
      localStorage.setItem('buddy2api:theme', this.theme);
      this.applyTheme();
    },

    /* ── 图标 ── */
    ic(name){
      const p = ICONS[name];
      return p ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>` : '';
    },

    /* ── 初始化 ── */
    async init(){
      this.applyTheme();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(this.theme==='system') this.applyTheme(); });
      let rto;
      window.addEventListener('resize', ()=>{ clearTimeout(rto); rto=setTimeout(()=>{ if(this.view==='dashboard') this.renderDaily(); }, 200); });
      try{
        const r = await this.api('/admin/session');
        this.loggedIn = !!r.logged_in;
      }catch(e){ this.loggedIn = false; }
      this.ready = true;
      if(this.loggedIn) this.afterLogin();
    },
    afterLogin(){
      this.loadHealth(); this.loadKeys(); this.go(this.view);
    },
    go(v){
      this.view = v; this.mobileNav = false;
      if(v==='dashboard'){ this.loadStats(); this.loadModels(); }
      if(v==='account') this.loadAccount();
      if(v==='keys') this.loadKeys();
      if(v==='resources'){ this.loadResources(false); this.loadCheckin(); this.loadSettings(); }
      if(v==='logs') this.loadLogs(1);
      if(v==='settings') this.loadSettings();
    },

    /* ── API / 基础工具 ── */
    async api(path, opts={}){
      opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
      const r = await fetch(path, opts);
      if(r.status===401){ this.loggedIn=false; throw new Error('登录已过期'); }
      const data = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      return data;
    },
    toast(msg, type=''){
      const id = ++this._toastSeq;
      this.toasts.push({id,msg,type});
      setTimeout(()=>{ this.toasts = this.toasts.filter(t=>t.id!==id); }, 3400);
    },
    busy(fn){
      return async (...a)=>{ this.loading=true; try{ return await fn(...a); }
        catch(e){ this.toast(e.message,'err'); }
        finally{ this.loading=false; } };
    },
    askConfirm(title, message, fn){
      this.confirmBox = {open:true, title, message, onOk:()=>{ this.confirmBox.open=false; fn(); }};
    },
    copy(text){
      navigator.clipboard.writeText(text).then(()=>this.toast('已复制到剪贴板','ok'));
    },
    fmt(n){ return (n||0).toLocaleString(); },
    compact(n){
      n = n||0;
      if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
      if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
      if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
      return String(n);
    },
    ts(unix, withSec){
      if(!unix) return '—';
      const d = typeof unix==='number' ? new Date(unix*1000) : new Date(unix);
      if(isNaN(d.getTime())) return String(unix);
      const p = n=>String(n).padStart(2,'0');
      let s = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
      if(withSec) s += ':'+p(d.getSeconds());
      return s;
    },
    pct(a){
      if(!a.capacity_size) return 0;
      return Math.max(0, Math.min(100, a.capacity_remain/a.capacity_size*100)).toFixed(1);
    },
    fmtDosage(v){
      if(v==null) return '—';
      return typeof v==='number' ? String(+v.toFixed(2)) : v;
    },

    /* ── 登录 ── */
    async doLogin(){
      if(!this.password){ this.toast('请输入密码','err'); return; }
      this.loading = true;
      try{
        await this.api('/admin/login',{method:'POST',body:JSON.stringify({password:this.password})});
        this.loggedIn = true; this.password = '';
        this.toast('登录成功','ok');
        this.afterLogin();
      }catch(e){ this.toast(e.message,'err'); }
      this.loading = false;
    },
    async logout(){
      try{ await this.api('/admin/logout',{method:'POST'}); }catch(e){}
      this.loggedIn = false; this.view = 'dashboard';
      this.toast('已退出登录');
    },

    /* ── 健康状态 / 统计 ── */
    async loadHealth(){
      try{ this.health = await fetch('/health').then(r=>r.json()); }catch(e){}
    },
    get successRate(){
      const t = this.stats.total_requests||0;
      if(!t) return null;
      return (100*(1-(this.stats.error_count||0)/t)).toFixed(1);
    },
    get avg14(){
      const d = (this.stats.daily||[]).slice(-14);
      if(!d.length) return 0;
      return Math.round(d.reduce((s,x)=>s+(x.requests||0),0)/d.length);
    },
    get topModels(){
      return (this.stats.by_model||[]).slice().sort((a,b)=>b.requests-a.requests).slice(0,10);
    },
    get maxReq(){
      return Math.max(1, ...this.topModels.map(m=>m.requests||0));
    },
    async loadStats(){
      try{
        this.stats = await this.api('/admin/stats');
        this.$nextTick(()=>requestAnimationFrame(()=>this.renderDaily()));
      }catch(e){ this.toast(e.message,'err'); }
    },

    /* ── 图表：近 14 天（手写 SVG，双轴：柱=Tokens，线=请求·Catmull-Rom 平滑曲线） ── */
    renderDaily(){
      const el = document.getElementById('chartDaily');
      if(!el) return;
      const daily = (this.stats.daily||[]).slice(-14);
      if(!daily.length){ el.innerHTML = '<div class="chart-empty">暂无数据</div>'; return; }
      const W = el.clientWidth || 600;
      if(W < 40) return;
      const H = 236, padL = 34, padR = 44, padT = 12, padB = 24;
      const iw = W-padL-padR, ih = H-padT-padB;
      const maxB = Math.max(...daily.map(d=>d.tokens||0), 1);   // 柱：Tokens（左轴）
      const maxL = Math.max(...daily.map(d=>d.requests||0), 1); // 线：请求（右轴）
      const step = iw/daily.length;
      const barW = Math.max(4, Math.min(16, step*0.48));
      const cx = i => padL + step*i + step/2;
      const clampY = v => Math.max(padT+1, Math.min(padT+ih-1, v));
      const yB = v => padT + ih - v/maxB*ih;
      const yL = v => padT + ih - v/maxL*ih;
      // Catmull-Rom 转三次贝塞尔：相邻点作控制点，折线平滑过渡；控制点钳制在绘图区内防过冲
      const smoothPath = pts => {
        if(!pts.length) return '';
        if(pts.length===1) return `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
        let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
        for(let i=0;i<pts.length-1;i++){
          const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
          d += `C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${clampY(p1[1]+(p2[1]-p0[1])/6).toFixed(1)}`
             + ` ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${clampY(p2[1]-(p3[1]-p1[1])/6).toFixed(1)}`
             + ` ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
        }
        return d;
      };
      let s = '';
      for(let g=0; g<=4; g++){
        const gy = padT + ih - ih*g/4;
        s += `<line class="grid-line" x1="${padL}" x2="${W-padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"/>`;
        s += `<text class="axis-label" text-anchor="end" x="${padL-7}" y="${(gy+3.5).toFixed(1)}">${this.compact(Math.round(maxB*g/4))}</text>`;
        s += `<text class="axis-label" x="${W-padR+7}" y="${(gy+3.5).toFixed(1)}">${this.compact(Math.round(maxL*g/4))}</text>`;
      }
      daily.forEach((d,i)=>{
        const y = yB(d.tokens||0);
        s += `<rect class="bar-c" data-i="${i}" x="${(cx(i)-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,padT+ih-y).toFixed(1)}" rx="${Math.min(3,barW/2).toFixed(1)}"/>`;
      });
      const linePts = daily.map((d,i)=>[cx(i), clampY(yL(d.requests||0))]);
      s += `<path class="tok-line" d="${smoothPath(linePts)}"/>`;
      linePts.forEach(p=>{ s += `<circle class="tok-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`; });
      const k = Math.max(1, Math.ceil(daily.length/7));
      daily.forEach((d,i)=>{
        if(i%k===0 || i===daily.length-1) s += `<text class="axis-label" text-anchor="middle" x="${cx(i).toFixed(1)}" y="${H-6}">${(d.date||'').slice(5)}</text>`;
      });
      daily.forEach((d,i)=>{ s += `<rect class="hz" data-i="${i}" x="${(padL+step*i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${ih.toFixed(1)}" fill="transparent"/>`; });
      s += `<g class="tip" opacity="0" pointer-events="none"><rect class="tip-bg" rx="7" width="130" height="70"/><text class="tip-t" x="10" y="16"></text><text class="tip-l" x="10" y="30"></text><text class="tip-l" x="10" y="43"></text><text class="tip-l" x="10" y="56"></text></g>`;
      el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
      this._chartGeom = {padL, step, W};
      // 悬停提示
      const svg = el.querySelector('svg');
      const tip = svg.querySelector('.tip');
      const bg = tip.querySelector('.tip-bg');
      const [tt, l1, l2, l3] = tip.querySelectorAll('text');
      svg.querySelectorAll('.hz').forEach(hz=>{
        hz.addEventListener('mouseenter', ()=>{
          const i = +hz.dataset.i, d = daily[i];
          tt.textContent = d.date||'';
          l1.textContent = `请求数 ${this.fmt(d.requests||0)}`;
          l2.textContent = `Tokens 用量 ${this.fmt(d.tokens||0)}`;
          l3.textContent = `Credits 消耗 ${this.fmt(Math.round((d.credit||0)*100)/100)}`;
          const w = Math.max(...[tt,l1,l2].map(t=>t.getComputedTextLength())) + 20;
          bg.setAttribute('width', w.toFixed(0));
          const g = this._chartGeom;
          let tx = g.padL + g.step*i + g.step + 8;
          if(tx + w > g.W - 2) tx = g.padL + g.step*i - w - 8;
          tip.setAttribute('transform', `translate(${tx.toFixed(1)},${padT+2})`);
          tip.setAttribute('opacity','1');
          const bar = svg.querySelector(`.bar-c[data-i="${i}"]`);
          if(bar) bar.classList.add('hl');
        });
        hz.addEventListener('mouseleave', ()=>{
          tip.setAttribute('opacity','0');
          svg.querySelectorAll('.bar-c.hl').forEach(b=>b.classList.remove('hl'));
        });
      });
    },

    /* ── 账号 ── */
    async loadAccount(){
      try{ this.account = await this.api('/admin/account'); }catch(e){ this.toast(e.message,'err'); }
    },
    async refreshToken(){
      this.busy(async()=>{
        const r = await this.api('/admin/account/refresh',{method:'POST'});
        this.toast('已刷新，新有效期 '+r.expires_human,'ok');
        this.loadAccount(); this.loadHealth();
      })();
    },
    async testAccount(){
      this.busy(async()=>{
        const r = await this.api('/admin/account/test',{method:'POST'});
        r.ok ? this.toast('凭证可用，上游连通正常','ok') : this.toast('测试失败：'+r.message,'err');
      })();
    },
    deleteAccount(){
      this.askConfirm('退出登录','将删除本地保存的 OAuth 凭证，确定继续？', ()=>{
        this.busy(async()=>{
          await this.api('/admin/account',{method:'DELETE'});
          this.toast('已清除凭证','ok');
          this.loadAccount(); this.loadHealth();
        })();
      });
    },
    async exportAccount(){
      this.busy(async()=>{
        const r = await fetch('/admin/account/export');
        if(r.status===401){ this.loggedIn=false; throw new Error('登录已过期'); }
        if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error||('HTTP '+r.status)); }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'token.json';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        this.toast('凭证已导出','ok');
      })();
    },
    onImportFile(ev){
      const file = ev.target.files && ev.target.files[0];
      if(!file) return;
      this.importForm.filename = file.name;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const obj = JSON.parse(reader.result);
          this.importForm.access_token = obj.access_token || '';
          this.importForm.refresh_token = obj.refresh_token || '';
          this.importForm.domain = obj.domain || '';
          this.toast('已读取文件，确认后导入','ok');
        }catch(e){ this.toast('文件不是合法 JSON: '+e.message,'err'); }
      };
      reader.onerror = ()=>this.toast('读取文件失败','err');
      reader.readAsText(file);
      ev.target.value = '';
    },
    async importAccount(){
      const f = this.importForm;
      if(!f.access_token || !f.access_token.trim()){ this.toast('access_token 不能为空','err'); return; }
      this.busy(async()=>{
        const r = await this.api('/admin/account/import',{method:'POST',body:JSON.stringify({
          access_token:f.access_token.trim(),
          refresh_token:f.refresh_token.trim(),
          domain:f.domain.trim(),
        })});
        this.toast('导入成功：'+(r.nickname||r.uid||'已保存'),'ok');
        this.importModal = false;
        this.importForm = {access_token:'',refresh_token:'',domain:'',filename:''};
        this.loadAccount(); this.loadHealth();
      })();
    },

    /* ── OAuth 设备流 ── */
    async oauthStart(){
      this.busy(async()=>{
        const r = await this.api('/admin/account/oauth/start',{method:'POST'});
        this.oauth.state = r.state;
        this.oauth.auth_url = r.auth_url;
        this.oauth.poll_msg = '等待授权中…';
        this.oauth._deadline = Date.now() + 5*60*1000;
        window.open(r.auth_url, '_blank');
        this.oauth._timer = setInterval(()=>this.oauthPoll(), 3000);
        this.oauthPoll();
      })();
    },
    async oauthPoll(){
      if(!this.oauth.state) return;
      if(Date.now() > this.oauth._deadline){ this.oauthStop('超时未完成授权'); return; }
      try{
        const r = await this.api('/admin/account/oauth/poll?state='+encodeURIComponent(this.oauth.state));
        if(r.status==='success'){
          this.oauthStop();
          this.toast('登录成功：'+(r.account.nickname||r.account.uid),'ok');
          this.loadAccount(); this.loadHealth(); this.loadModels();
        }else if(r.status==='error'){
          this.oauthStop(r.message);
        }else{
          this.oauth.poll_msg = '等待授权中（'+new Date().toLocaleTimeString('zh-CN',{hour12:false})+'）';
        }
      }catch(e){ /* 网络抖动忽略，下轮继续 */ }
    },
    oauthStop(errMsg){
      if(this.oauth._timer){ clearInterval(this.oauth._timer); this.oauth._timer = null; }
      if(errMsg){ this.toast(errMsg,'err'); this.oauth.poll_msg = errMsg; }
      setTimeout(()=>{ this.oauth.state=''; this.oauth.auth_url=''; }, errMsg?2500:400);
    },
    oauthCancel(){ this.oauthStop(); },

    /* ── Keys ── */
    async loadKeys(){
      try{ const r = await this.api('/admin/api-keys'); this.keys = r.keys||[]; }catch(e){}
    },
    async createKey(){
      this.busy(async()=>{
        const f = this.keyForm;
        await this.api('/admin/api-keys',{method:'POST',body:JSON.stringify({
          name:f.name, custom_key:f.custom_key })});
        this.toast('Key 已创建','ok');
        this.keyModal = false;
        this.keyForm = {name:'',custom_key:''};
        this.loadKeys();
      })();
    },
    async updateKey(k, patch){
      try{
        await this.api('/admin/api-keys/'+k.id,{method:'PUT',body:JSON.stringify(patch)});
        this.toast('已更新','ok'); this.loadKeys();
      }catch(e){ this.toast(e.message,'err'); }
    },
    deleteKey(k){
      this.askConfirm('删除 Key','确定删除该 Key？此操作不可撤销。', ()=>{
        this.busy(async()=>{
          await this.api('/admin/api-keys/'+k.id,{method:'DELETE'});
          this.toast('已删除','ok'); this.loadKeys();
        })();
      });
    },

    /* ── 余额 ── */
    async loadResources(force){
      if(this.resources._loading) return;
      this.resources._loading = true; this.loading = true;
      try{
        const r = await this.api('/admin/resources'+(force?'?force=1':''));
        this.resources = Object.assign({loaded:true}, r.data||{});
      }catch(e){
        this.toast(e.message,'err');
        this.resources.loaded = true;
      }finally{
        this.resources._loading = false; this.loading = false;
      }
    },
    quotaBadge(a){
      if(a.warn==='expired') return 'badge-err';
      return a.warn ? 'badge-warn' : 'badge-ok';
    },
    quotaBadgeText(a){
      if(a.warn==='expired') return '已过期';
      return a.warn ? a.warn+' 内到期' : '正常';
    },
    quotaBarClass(a){
      if(a.warn==='expired') return 'err';
      return a.warn ? 'warn' : '';
    },
    quotaExpire(a){
      return a.expire_time || (a.days_left!=null ? a.days_left+' 天后' : '—');
    },

    /* ── 签到 ── */
    checkinHint(){
      const s = this.settings || {};
      if(!s.auto_checkin) return '可在「设置」中开启自动签到，支持定时或时间范围内随机执行';
      if(s.checkin_mode==='random'){
        const base = `每天 ${s.checkin_random_start}–${s.checkin_random_end} 内随机签到`;
        return this.checkin.random_target ? `今日随机时刻 ${this.checkin.random_target}（${base}）` : base;
      }
      return `按 Cron 定时签到（${s.checkin_cron}）`;
    },
    async loadCheckin(){
      try{
        const r = await this.api('/admin/checkin/status');
        const d = r.data && r.data.data ? r.data.data : (r.data||{});
        this.checkin = Object.assign({loaded:true, random_target:r.random_target||''}, d);
      }catch(e){ this.toast(e.message,'err'); }
    },
    async claimCheckin(){
      this.busy(async()=>{
        const r = await this.api('/admin/checkin/claim',{method:'POST'});
        const d = (r.data && r.data.data) || {};
        if(d.credit > 0){ this.toast('签到成功，+'+d.credit+' 积分','ok'); }
        else{ this.toast('今日已签到或暂不可领取'); }
        this.loadCheckin();
      })();
    },

    /* ── 日志 ── */
    loadLogsDebounced(){
      clearTimeout(this._logT);
      this._logT = setTimeout(()=>this.loadLogs(1), 500);
    },
    async loadLogs(page){
      if(page<1) page = 1;
      const f = this.logFilter;
      const qs = new URLSearchParams({page, page_size:this.logPageSize});
      if(f.model) qs.set('model', f.model);
      if(f.key_id) qs.set('key_id', f.key_id);
      if(f.status) qs.set('status', f.status);
      try{
        const r = await this.api('/admin/logs?'+qs);
        this.logs = r.logs||[]; this.logTotal = r.total||0; this.logPage = page;
      }catch(e){ this.toast(e.message,'err'); }
    },

    /* ── 设置 / 模型 ── */
    get modelChips(){
      const arr=this.models.models||[];
      if(!arr.length) return (this.models.ids||[]).map(id=>({id,name:id,disp:id,credits:'',promo:''}));
      // 同名模型消歧：显示名重复时附上 id，如 Hy3(hy3) / Hy3(hy3-x)
      const label=m=>(m.name&&m.name!==m.id)?m.name:m.id;
      const cnt={};
      arr.forEach(m=>{const l=label(m);cnt[l]=(cnt[l]||0)+1});
      return arr.map(m=>{const l=label(m);return{id:m.id,name:l,disp:cnt[l]>1?l+'('+m.id+')':l,credits:m.credits||'',promo:m.promo||''}});
    },
    get modelsStateText(){
      const m = this.models.state;
      if(!m) return '';
      return (m.fallback?'内置回退表':'实时列表')+' · '+(m.count??0)+' 个模型'+(m.fetched_at?' · 更新于 '+this.ts(m.fetched_at):'');
    },
    async loadModels(){
      this.models.loading = true;
      try{
        const r = await this.api('/admin/models');
        this.models.models = r.models||[];
        this.models.ids = r.ids||[];
        this.models.state = r.state||null;
      }catch(e){ /* 静默，设置页不走这里 */ }
      finally{ this.models.loading = false; }
    },
    async loadSettings(){
      try{ this.settings = await this.api('/admin/settings'); }catch(e){}
    },
    async refreshModels(){
      this.busy(async()=>{
        const r = await this.api('/admin/models/refresh',{method:'POST'});
        this.toast('模型列表已刷新（'+(r.ids||[]).length+' 个）','ok');
        this.loadModels();
      })();
    },
    async saveSettings(){
      this.busy(async()=>{
        const s = this.settings, body = {
          listen:(s.listen||'').trim(),
          region:s.region, auto_checkin:!!s.auto_checkin,
          checkin_cron:s.checkin_cron, checkin_mode:s.checkin_mode||'fixed',
          checkin_random_start:s.checkin_random_start||'', checkin_random_end:s.checkin_random_end||'',
          checkin_fallback:!!s.checkin_fallback,
          resource_cache_seconds:+s.resource_cache_seconds,
          chat_timeout_seconds:+s.chat_timeout_seconds,
          log_retention_days:+s.log_retention_days, log_max_size_mb:+s.log_max_size_mb,
        };
        if(this.pwForm.old_password || this.pwForm.new_password){
          body.old_password = this.pwForm.old_password;
          body.new_password = this.pwForm.new_password;
        }
        this.settings = await this.api('/admin/settings',{method:'PUT',body:JSON.stringify(body)});
        this.pwForm = {old_password:'',new_password:''};
        this.toast('设置已保存'+(body.listen?'，监听地址修改需手动重启服务生效':''),'ok');
        this.loadHealth();
      })();
    },
  };
}
</script>
